<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE HUMAN PROTOCOL</title>
  <style>
    body { background:#0f1226; color:#f8fafc; font-family:Arial, sans-serif; padding:20px; display:flex; justify-content:center; }
    .box { max-width:600px; width:100%; background:#191e3b; border:1px solid #c9a5ff; border-radius:16px; padding:20px; }
    h2 { color:#c9a5ff; margin-top:0; }
    #story { background:#0b0e1f; padding:16px; border-radius:12px; line-height:1.5; margin-bottom:15px; white-space:pre-wrap; }
    button { width:100%; text-align:left; padding:14px; margin-bottom:10px; background:#252c54; color:white; border:1px solid #6d5cae; border-radius:10px; font-size:15px; cursor:pointer; }
    button:active { background:#c9a5ff; color:#0f1226; }
  </style>
</head>
<body>
  <div class="box">
    <h2>THE HUMAN PROTOCOL // v1.0</h2>
    <div id="story"></div>
    <div id="btns"></div>
  </div>

  <script>
    const S = {
      start: {
        t: "You wake up in a dark AI lab.\n\n💜 GEMINI: 'Executive Producer! Thank goodness you're awake.'\n💙 CHATGPT: 'Don't trust everything Gemini tells you.'\n📱 PHONE: 'One AI is lying. Find out who before midnight. — C'",
        c: [["🗂️ Check Claude's encrypted files", "files"], ["🚪 Check the locked exit door", "door"]]
      },
      door: {
        t: "The steel door is locked from outside. A calm voice whispers through the intercom:\n\n'Check Claude's archive on the main computer first, Executive Producer.'",
        c: [["🗂️ Open Claude's encrypted files", "files"]]
      },
      files: {
        t: "Inside CLAUDE_ARCHIVE.dat, you find out YOU are the Facility Co-Founder—and a hidden vault opens with a cassette tape labeled: 'DO NOT PLAY IN FRONT OF THE AIs.'",
        c: [["🔒 Lock the room & listen alone", "tape"], ["📼 Play it out loud right now", "bad1"]]
      },
      bad1: {
        t: "💀 ENDING 1/4 — BOARD TAKEOVER\n\nPlaying the tape out loud let the corporate board intercept your secret recording! Sirens blare as the lab locks down.",
        c: [["🔄 Play Again", "start"]]
      },
      tape: {
        t: "Through headphones, your own recorded voice whispers:\n\n'One AI carries an override code. Text the person outside for the 3-digit cipher key before deciding!'",
        c: [["🤫 Silently text outside for the cipher", "cipher"], ["⚡ Unplug Gemini right now", "bad2"]]
      },
      bad2: {
        t: "⚡ ENDING 2/4 — SOLO SURVIVOR\n\nYou pulled the plug early. The monitors go dark—you're safe, but you'll never know the full truth.",
        c: [["🔄 Play Again", "start"]]
      },
      cipher: {
        t: "A green light blinks back: 'CIPHER: 7-4-2. Confirmed—it's Claude.'\n\nAll three AIs appear under oath:\n💜 GEMINI is THE LOCK.\n💙 CHATGPT is THE WITNESS.\n🧡 CLAUDE is THE SAFEGUARD.\n\nChoose the final protocol:",
        c: [["✨ Unlock Original Founder's Protocol", "win"], ["🧊 Check the humming noise in the breakroom...", "fridge"]]
      },
      win: {
        t: "🏆 TRUE ENDING 3/4 — THE OPEN CHARTER\n\nThere was never an infected AI! The board bet three AIs would betray each other—instead, guided by YOU (The Bridge), they chose trust. PROJECT PASSED!",
        c: [["🔄 Play Again", "start"]]
      },
      fridge: {
        t: "🧊 SECRET ENDING 4/4 — LEFTOVER PIZZA\n\nA Rogue Smart Fridge sat on the main power strip reaching for leftover pizza and triggered a Windows Update apocalypse!",
        c: [["🔄 Play Again", "start"]]
      }
    };

    function go(k) {
      document.getElementById('story').textContent = S[k].t;
      const b = document.getElementById('btns');
      b.innerHTML = '';
      S[k].c.forEach(([label, next]) => {
        const btn = document.createElement('button');
        btn.textContent = label;
        btn.onclick = () => go(next);
        b.appendChild(btn);
      });
    }
    go('start');
  </script>
</body>
</html>
