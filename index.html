<!DOCTYPE html>

<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1b1336, #090b14 75%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .terminal {
      width: 100%;
      max-width: 680px;
      background: rgba(15, 20, 38, 0.92);
      border: 1px solid rgba(201, 165, 255, 0.35);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      padding-bottom: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .title { font-weight: 800; letter-spacing: 1.5px; color: #c9a5ff; font-size: 0.95rem; }
    .stats { display: flex; gap: 10px; font-size: 0.8rem; color: #94a3b8; }
    .badge { background: rgba(30, 41, 59, 0.9); padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(201, 165, 255, 0.25); }
    .scene-tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #38bdf8; margin-bottom: 8px; }
    .story-box {
      min-height: 180px;
      background: rgba(9, 11, 20, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 14px;
      padding: 18px;
      line-height: 1.6;
      font-size: 0.98rem;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .clues {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      min-height: 26px;
    }
    .clue-chip {
      font-size: 0.75rem;
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.4);
      color: #fde047;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .choices { display: flex; flex-direction: column; gap: 10px; }
    button.choice-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(201, 165, 255, 0.3);
      border-radius: 12px;
      color: #f8fafc;
      font-size: 0.94rem;
      cursor: pointer;
    }
    button.choice-btn:active {
      background: rgba(201, 165, 255, 0.25);
      border-color: #c9a5ff;
    }
    .footer-links { margin-top: 16px; text-align: center; font-size: 0.8rem; }
    .footer-links a { color: #94a3b8; text-decoration: none; }
  </style>
</head>
